app: apihydra #required - used for filtering when mixed non-apihydra YAML files
kind: tasks #required - can be config or tasks
metadata:
  name: create-tasks #optional - must be unique if used - used for querying tasks
  labels: [create, tasks] #optional - used for querying tasks
spec:
  tasks:
    - vars: #optional - write-once values available before request resolution
        project_id: 1
      request:
        method: POST #optional - default GET - default with body POST
        baseUrl: https://api.example.com #optional - typically inherited from `config`
        basePath: /api/v1 #optional - typically inherited from `config`
        path: /api/users #required
        headers: #optional - typically inherited from `config`
          Content-Type: application/json
          Accept: application/json
        timeout: 10 #optional - seconds - typically inherited - default 10
        retries: 3 #optional - typically inherited - default 3
        query: page=1&limit=20&sort=name #optional
        body: | #required for POST - literal JSON string
          {
            "project_id": $project_id,
            "title": "API tester Title",
            "def": "API tester Def"
          }
      response:
        status: [200, 201] #optional - accepted HTTP response statuses
        capture: #optional - jq expressions stored as write-once variables
          change_id: .id
        types: #optional
          ".changed": [datetime]
          ".modified": [datetime, optional]
        expected: | #optional - literal JSON string
          {
            "id": $change_id,
            "agent_edit": false,
            "change_phase": "backlog",
            "change_types": []
          }
