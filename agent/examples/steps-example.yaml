# Shape-only example. Values illustrate fields and do not define validation or runtime behavior.
app: apihydra
kind: steps
metadata:
  name: create-steps
  labels: [create, steps]
spec:
  defaults:
    base_path: /api/v1
    headers:
      Accept: application/json
    disable_cookies: true
    timeout: 10
    retries: 3
  steps:
    - vars:
        project_id: example-project
      request:
        method: POST
        path: /api/users
        query: page=1&limit=20&sort=name
        body: |
          {
            "project_id": "example-project",
            "title": "Example title"
          }
        defaults:
          base_url: https://api.example.com
          headers:
            Content-Type: application/json
          disable_cookies: false
      response:
        expected_status: 201
        capture:
          change_id: example-capture-expression
        expected_types:
          example.selector: [example-type]
        expected_body: |
          {
            "agent_edit": false,
            "change_phase": "backlog",
            "change_types": []
          }
