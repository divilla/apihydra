app: apihydra
kind: steps
metadata:
  name: change-create-invalid-input
  labels: [mch-api, change, invalid]
spec:
  steps:
    - request:
        path: /change/create
        body: '{"project_id":999999999,"title":"orphan change","def":"Orphan def"}'
      response:
        expected_status: 400
    - request:
        path: /project/create
        body: '{"name":"apih-change-create-invalid-project"}'
      response:
        expected_status: 201
        capture:
          cci_project_id: .id
    - request:
        path: /change/create
        body: '{"project_id":$cci_project_id,"title":"   ","def":"Blank title def"}'
      response:
        expected_status: 400
    - request:
        path: /change/create
        body: '{"project_id":$cci_project_id,"title":"blank def change","def":"   "}'
      response:
        expected_status: 400
    - request:
        path: /project/delete
        body: '{"id":$cci_project_id}'
      response:
        expected_status: 204
