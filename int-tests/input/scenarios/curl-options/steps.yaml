app: apihydra
kind: steps
spec:
  steps:
    - request:
        method: GET
        query: first=1
        defaults:
          base_url: http://APIH_TEST_SERVER?
      response:
        expected_body: '{"id":7,"ok":true}'
    - request:
        method: GET
        query: second=2
        defaults:
          base_url: http://APIH_TEST_SERVER?first=1&
      response:
        expected_body: '{"id":7,"ok":true}'
    - request:
        method: GET
        query: fragment=1
        defaults:
          base_url: http://APIH_TEST_SERVER#integration
      response:
        expected_body: '{"id":7,"ok":true}'
