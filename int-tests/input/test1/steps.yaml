app: apihydra
kind: steps
metadata:
  name: integration-success-steps
  labels: [integration, success]
spec:
  steps:
    - vars:
        name: alpha
        expected_id: '7'
      request:
        path: /items
        headers:
          X-Step: local
        query: source=integration
        body: '{"name":"$name"}'
      response:
        expected_status: 200
        expected_body: '{"id":$expected_id,"ok":true,"metadata":{"state":"ready"}}'
        expected_types:
          .id: [number]
          .ok: [boolean]
        capture:
          item_id: .id
    - request:
        method: POST
        path: /items/captured
        body: '{"id":${item_id}}'
      response:
        expected_body: '{"id":7,"ok":true}'
    - request:
        method: HEAD
        path: /head
      response:
        expected_status: 200
