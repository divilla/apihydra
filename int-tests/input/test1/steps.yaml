app: apihydra
kind: steps
metadata:
  name: integration-success-steps
  labels: [integration, success]
spec:
  defaults:
    base_path: /api
    headers:
      X-Definition: inherited
    timeout: 11
    retries: 2
  steps:
    - vars:
        name: alpha
        expected_id: '7'
      request:
        path: /items
        query: source=integration
        body: '{"name":"$name"}'
        defaults:
          headers:
            X-Step: local
          timeout: 10
          retries: 1
      response:
        expected_status: 200
        expected_body: '{"id":$expected_id,"ok":true,"metadata":{"state":"ready"}}'
        expected_types:
          .id: [number]
          .ok: [boolean]
        capture:
          item_id: .id
    - request:
        method: POST
        path: /items/captured
        body: '{"id":${item_id}}'
      response:
        expected_body: '{"id":7,"ok":true}'
    - request:
        method: HEAD
        path: /head
      response:
        expected_status: 200
