app: apihydra
kind: steps
metadata:
  name: integration-validation-steps
  labels: [integration, validation]
spec:
  steps:
    - request:
        path: /status-mismatch
      response:
        expected_status: 201
        expected_body: '{"id":9,"ok":true}'
        expected_types:
          .id: [string]
    - request:
        path: /implicit-post
        body: '{"continued":true}'
      response:
        expected_body: '{"id":7,"ok":true,"aaa":null}'
        expected_types:
          .id: [string]
